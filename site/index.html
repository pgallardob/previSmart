<!doctype html>
<html lang="es-CL" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; font-src 'self' data: blob:; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self' https://mindicador.cl http://localhost:* http://127.0.0.1:* https://localhost:* https://127.0.0.1:*; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PreviSmart — Copiloto previsional</title>
  <meta name="description" content="Herramienta del asesor previsional para acompañar el proceso AFP → renta vitalicia. UF del día, elegibilidad, beneficios estatales, comparador SCOMP y checklists. Chile, octubre 2026.">
  <meta name="theme-color" content="#0C5A54">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="./css/vendor/pico.min.css">
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/pico.overrides.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/print.css" media="print">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <header class="appbar">
    <div class="appbar__inner">
      <a class="brand" href="#/panel" aria-label="PreviSmart, ir al panel">
        <svg class="icon" aria-hidden="true"><use href="./assets/icons/sprite.svg#i-shield-check"></use></svg>
        <span>PreviSmart</span>
        <span class="brand__tag">asesor</span>
        <span class="brand__tag" id="brand-version" title="Versión de la aplicación"></span>
      </a>
      <div class="appbar__actions">
        <button id="btn-actualizar-app" class="btn btn--secondary btn--sm" type="button" hidden>Actualizar app</button>
        <button id="btn-instalar" class="btn btn--secondary btn--sm" type="button" hidden>
          <svg class="icon" aria-hidden="true"><use href="./assets/icons/sprite.svg#i-download"></use></svg>
          Instalar
        </button>
        <button id="uf-pill" class="uf-pill" type="button" aria-label="Valor UF, opciones">
          <span class="uf-pill__label">UF</span>
          <span class="uf-pill__valor">…</span>
        </button>
        <button id="btn-tema" class="icon-btn" type="button" aria-label="Cambiar tema">
          <svg id="icono-tema" class="icon" aria-hidden="true"><use href="./assets/icons/sprite.svg#i-moon"></use></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="layout">
    <nav id="nav-desktop" class="sidenav" aria-label="Navegación principal"></nav>
    <main id="contenido" class="view" tabindex="-1"></main>
  </div>

  <footer class="app-footer">
    <p>© 2026 Todos los derechos reservados · Desarrollado por P. Gallardo</p>
  </footer>

  <nav id="nav-mobile" class="tabbar" aria-label="Navegación principal"></nav>

  <dialog id="dlg-mas" class="sheet" aria-label="Todos los módulos"></dialog>

  <dialog id="dlg-uf" class="centrado" aria-labelledby="dlg-uf-titulo">
    <article>
      <h3 id="dlg-uf-titulo">Unidad de Fomento (UF)</h3>
      <div id="dlg-uf-estado"></div>
      <form id="uf-manual-form">
        <div class="field u-mt-4">
          <label for="uf-manual-input">Ingresar valor manualmente</label>
          <input id="uf-manual-input" type="text" inputmode="decimal" placeholder="41081,76" autocomplete="off">
          <p class="field__ayuda">Úsalo solo si no hay conexión y el valor guardado está desactualizado.</p>
        </div>
        <div class="u-flex u-gap-2 u-wrap">
          <button class="btn btn--primary btn--sm" type="submit">Guardar manual</button>
          <button id="uf-refrescar" class="btn btn--secondary btn--sm" type="button">
            <svg class="icon" aria-hidden="true"><use href="./assets/icons/sprite.svg#i-wifi"></use></svg>
            Actualizar en línea
          </button>
          <button class="btn btn--secondary btn--sm" type="button" data-cerrar>Cerrar</button>
        </div>
      </form>
    </article>
  </dialog>

  <div id="toast-region" role="status" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
